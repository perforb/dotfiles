"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$aws\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "250"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[❯](211)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "245"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](211) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[aws]
format = "[aws:$profile]($style) "
style = "208"
force_display = true

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
